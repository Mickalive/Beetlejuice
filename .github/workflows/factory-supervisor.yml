name: BEETLEJUICE Factory Supervisor

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "BEETLEJUICE Product Factory"
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-supervisor.yml'
      - '.github/workflows/factory-loop.yml'
      - '.github/scripts/run-opencode-with-retry.sh'
      - 'state/factory.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: beetlejuice-factory-supervisor
  cancel-in-progress: false

jobs:
  continuity:
    name: Ensure product factory continuity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Purge obsolete completed Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Keep the Actions page readable. Durable product evidence belongs in
          # state/ and reports/, not in hundreds of stale run rows.
          KEEP_PER_ACTIVE_WORKFLOW=5
          ACTIVE_NAMES=(
            "BEETLEJUICE Product CI"
            "BEETLEJUICE Product Factory"
            "BEETLEJUICE Factory Supervisor"
          )

          STATE=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/state/factory.json?ref=main" 2>/dev/null || echo '{}')
          PRESERVE_IDS=$(jq -r '
            .. | objects | to_entries[]?
            | select(.key | test("run_id$"))
            | .value
            | select(type == "number")
          ' <<<"$STATE" 2>/dev/null | sort -u || true)

          mapfile -t RUN_ROWS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id,.name,.status,.created_at] | @tsv'
          )

          declare -A KEPT_BY_NAME=()
          DELETED=0
          PRESERVED=0

          is_active_name() {
            local candidate="$1"
            for active in "${ACTIVE_NAMES[@]}"; do
              [[ "$candidate" == "$active" ]] && return 0
            done
            return 1
          }

          is_evidence_run() {
            local candidate="$1"
            grep -qx "$candidate" <<<"$PRESERVE_IDS" 2>/dev/null
          }

          # GitHub returns newest runs first. Keep five completed runs for each
          # current workflow. For workflow names no longer present in the repo,
          # remove every completed run unless state/factory.json cites it.
          for row in "${RUN_ROWS[@]}"; do
            IFS=$'\t' read -r RUN_ID RUN_NAME RUN_STATUS CREATED_AT <<<"$row"
            [[ -n "$RUN_ID" ]] || continue

            if [[ "$RUN_STATUS" != "completed" ]]; then
              PRESERVED=$((PRESERVED + 1))
              continue
            fi

            if is_evidence_run "$RUN_ID"; then
              echo "Preserving evidence run $RUN_ID ($RUN_NAME)"
              PRESERVED=$((PRESERVED + 1))
              continue
            fi

            if is_active_name "$RUN_NAME"; then
              COUNT=${KEPT_BY_NAME["$RUN_NAME"]:-0}
              if (( COUNT < KEEP_PER_ACTIVE_WORKFLOW )); then
                KEPT_BY_NAME["$RUN_NAME"]=$((COUNT + 1))
                PRESERVED=$((PRESERVED + 1))
                continue
              fi
            fi

            echo "Deleting obsolete completed run $RUN_ID [$RUN_NAME] $CREATED_AT"
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" >/dev/null 2>&1; then
              DELETED=$((DELETED + 1))
            else
              echo "::warning::Could not delete run $RUN_ID"
            fi
          done

          echo "Actions cleanup complete: deleted=$DELETED preserved=$PRESERVED"

      - name: Re-derive continuation from durable state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow factory-loop.yml --limit 50 \
            --json databaseId,status,conclusion,createdAt,headSha 2>/dev/null || echo '[]')

          # A change to the execution workflow, Ox watchdog/model policy, or the
          # supervisor itself invalidates already-running factory executions.
          # Stop those runs so no stale process can keep using an older model policy.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            CHANGED=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
              --jq '.files[]?.filename' 2>/dev/null || true)
            if grep -Eq '^(\.github/workflows/factory-loop\.yml|\.github/scripts/run-opencode-with-retry\.sh|\.github/workflows/factory-supervisor\.yml)$' <<<"$CHANGED"; then
              while IFS= read -r RUN_ID; do
                [[ -n "$RUN_ID" ]] || continue
                RUN_SHA=$(jq -r --argjson id "$RUN_ID" '.[] | select(.databaseId == $id) | .headSha' <<<"$RUNS")
                if [[ "$RUN_SHA" != "$GITHUB_SHA" ]]; then
                  echo "Stopping stale factory run $RUN_ID at $RUN_SHA after control-plane update $GITHUB_SHA"
                  gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" >/dev/null 2>&1 || true
                  gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/force-cancel" >/dev/null 2>&1 || true
                fi
              done < <(jq -r '.[] | select(.status != "completed") | .databaseId' <<<"$RUNS")
              echo "Stale factory executions stopped; the next cycle will use the current Ox-only control plane."
              exit 0
            fi
          fi

          ACTIVE=$(jq '[.[] | select(.status != "completed")] | length' <<<"$RUNS")
          if [[ "$ACTIVE" -gt 0 ]]; then
            echo "A Beetlejuice factory cycle is already active; refusing duplicate work."
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/branches/lab%2Fintegration" >/dev/null 2>&1; then
            STATE=$(gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/state/factory.json?ref=lab/integration" 2>/dev/null || echo '{}')
          else
            STATE=$(gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/state/factory.json?ref=main" 2>/dev/null || echo '{}')
          fi

          CONTINUE=$(jq -r '.continue // true' <<<"$STATE" 2>/dev/null || echo true)
          STATUS=$(jq -r '.status // "BUILDING"' <<<"$STATE" 2>/dev/null || echo BUILDING)
          NEXT_ACTION=$(jq -r '.next_action // "IMPLEMENT_P0"' <<<"$STATE" 2>/dev/null || echo IMPLEMENT_P0)

          case "$STATUS" in
            COMPLETE|BLOCKED_EXTERNAL)
              echo "Factory state is $STATUS; no autonomous relaunch. next_action=$NEXT_ACTION"
              exit 0
              ;;
            P0_READY|P0_5_READY)
              if [[ "$CONTINUE" != true ]]; then
                echo "$STATUS and state does not request more autonomous work."
                exit 0
              fi
              ;;
          esac

          if [[ "$CONTINUE" == true ]]; then
            echo "Relaunching Beetlejuice factory from durable state: status=$STATUS next_action=$NEXT_ACTION"
            gh workflow run factory-loop.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "Factory state explicitly sets continue=false; no relaunch."
          fi