name: BEETLEJUICE Product Factory

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: beetlejuice-product-factory
  cancel-in-progress: false

env:
  BEETLEJUICE_MODEL: opencode/x-preview-f-free

jobs:
  lanes:
    name: "BUILD — ${{ matrix.lane }}"
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core
            agent: core_builder
            owned_path: packages/core
            mission: "Advance the highest-priority unfinished core/domain-model gate from durable state. P0.5 architecture learning comes before P1; once P0_5_READY is evidenced, advance the next P1/roadmap core capability instead of repeating completed work."
          - lane: github
            agent: github_builder
            owned_path: packages/github
            mission: "Advance the highest-priority unfinished GitHub/evidence gate from durable state. P0.5 real-GitHub architecture reconstruction comes before P1; once P0_5_READY is evidenced, advance the next installable GitHub App/roadmap adapter capability."
          - lane: privacy
            agent: privacy_builder
            owned_path: packages/privacy
            mission: "Advance the highest-priority unfinished privacy/data-boundary gate from durable state. P0.5 unlinkable architecture export comes before P1; after it is evidenced, advance the next privacy requirement of the active roadmap phase."
          - lane: product
            agent: product_builder
            owned_path: apps
            mission: "Advance the highest-priority unfinished product-surface gate from durable state. P0.5 real-world architecture evidence comes before P1; once P0_5_READY is evidenced, advance the next installable product/roadmap capability rather than polishing a completed gate."

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Start product lane with binding main policy and durable progress state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          CONTROL=/tmp/beetlejuice-control-plane
          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"
          for path in .github/scripts .opencode AGENTS.md docs; do
            if git cat-file -e "origin/main:${path}" 2>/dev/null; then
              git archive --format=tar origin/main "$path" | tar -xf - -C "$CONTROL"
            fi
          done

          if git ls-remote --exit-code --heads origin refs/heads/lab/integration >/dev/null 2>&1; then
            git fetch origin lab/integration:refs/remotes/origin/lab/integration
            BASE=origin/lab/integration
          else
            BASE=origin/main
          fi
          BASE_SHA=$(git rev-parse "$BASE")
          BRANCH="cycle/${GITHUB_RUN_ID}/${{ matrix.lane }}"
          git switch -C "$BRANCH" "$BASE_SHA"
          cp -a "$CONTROL/." .

          echo "BEETLEJUICE_CYCLE_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "BEETLEJUICE_CYCLE_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Install OpenCode
        shell: bash
        run: bash .github/scripts/install-opencode-with-retry.sh

      - name: Run lane agent with resilient retry
        shell: bash
        run: |
          bash .github/scripts/run-opencode-with-retry.sh run \
            --model "$BEETLEJUICE_MODEL" \
            --agent "${{ matrix.agent }}" \
            "${{ matrix.mission }} Work only on the already-checked-out cycle branch from the immutable integration product base. Binding policy (.opencode, AGENTS.md, docs and runtime scripts) comes from current main; cumulative progress state comes from lab/integration and must never be reset by an older main copy. Read state/factory.json and the product objective to identify the active gate. P0 is already green. P0.5 outranks P1 until P0_5_READY is defensible; once it is, move to P1 and then the next declared roadmap work instead of repeating completed P0.5 tasks. Produce durable tested product progress inside your owned path ${{ matrix.owned_path }}. Do NOT git fetch, pull, merge, rebase, cherry-pick, switch, checkout or reset to another ref. Do NOT modify .github/**, docs/**, AGENTS.md or state/**. Inspect state/factory.json only as read-only context; do not declare global product completion. Never put credential-shaped literal fixtures (Slack/GitHub/AWS/API tokens or similar) in source or tests; construct fake sensitive values from harmless fragments at runtime. Follow the AGENTS.md anti-spin rule: after a zero-delta approach, change strategy rather than repeating it."

      - name: Repair credential-shaped fixtures before persistence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "BEETLEJUICE_SNAPSHOT_SAFE=false" >> "$GITHUB_ENV"
          OWNED="${{ matrix.owned_path }}"
          [[ -d "$OWNED" ]] || { echo "::error::Owned path missing: $OWNED"; exit 1; }
          MATCHES=$(grep -RIlE 'xox[baprs]-[A-Za-z0-9-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' "$OWNED" --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null || true)
          REPAIR_RC=0
          if [[ -n "$MATCHES" ]]; then
            printf 'Credential-shaped literals detected in:\n%s\n' "$MATCHES"
            bash .github/scripts/run-opencode-with-retry.sh run \
              --model "$BEETLEJUICE_MODEL" \
              --agent "${{ matrix.agent }}" \
              "Before this lane can be persisted, remove every credential-shaped literal from these owned-lane files: ${MATCHES//$'\n'/, }. Preserve the test intent by constructing fake values from harmless string fragments at runtime. Do not expose or print the sensitive-looking values. Work only inside $OWNED; do not fetch/merge/rebase or modify the control plane. Re-run the affected tests." || REPAIR_RC=$?
          fi
          REMAINING=$(grep -RIlE 'xox[baprs]-[A-Za-z0-9-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' "$OWNED" --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null || true)
          if [[ "$REPAIR_RC" -ne 0 || -n "$REMAINING" ]]; then
            echo "::error::Lane is not safe to persist; credential-shaped fixture repair failed or literals remain."
            exit 1
          fi
          echo "BEETLEJUICE_SNAPSHOT_SAFE=true" >> "$GITHUB_ENV"

      - name: Rebuild hermetic lane snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "BEETLEJUICE_SNAPSHOT_READY=false" >> "$GITHUB_ENV"
          OWNED="${{ matrix.owned_path }}"
          SNAP="/tmp/beetlejuice-owned-${{ matrix.lane }}"
          [[ -d "$OWNED" ]] || { echo "::error::Owned path missing: $OWNED"; exit 1; }
          rm -rf "$SNAP"
          mkdir -p "$SNAP/$(dirname "$OWNED")"
          cp -a "$OWNED" "$SNAP/$OWNED"

          git reset --hard "$BEETLEJUICE_CYCLE_BASE_SHA"
          git clean -fdx
          rm -rf "$OWNED"
          mkdir -p "$(dirname "$OWNED")"
          cp -a "$SNAP/$OWNED" "$OWNED"

          git config user.name "beetlejuice-${{ matrix.lane }}-builder"
          git config user.email "beetlejuice-${{ matrix.lane }}@autonomous.local"
          git add -- "$OWNED"
          git commit -m "Factory ${GITHUB_RUN_ID}: ${{ matrix.lane }} hermetic lane" || true

          BAD=$(git diff --name-only "$BEETLEJUICE_CYCLE_BASE_SHA"..HEAD | grep -vE '^${{ matrix.owned_path }}(/|$)' || true)
          if [[ -n "$BAD" ]]; then
            echo "::error::Hermetic snapshot contains out-of-lane files:"
            echo "$BAD"
            exit 1
          fi
          echo "BEETLEJUICE_SNAPSHOT_READY=true" >> "$GITHUB_ENV"

      - name: Archive lane snapshot before tests and push
        if: always() && env.BEETLEJUICE_SNAPSHOT_SAFE == 'true' && env.BEETLEJUICE_SNAPSHOT_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beetlejuice-lane-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ matrix.owned_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Install workspace for hermetic tests
        if: always() && env.BEETLEJUICE_SNAPSHOT_READY == 'true'
        shell: bash
        run: npm install --ignore-scripts

      - name: Run real lane tests
        if: always() && env.BEETLEJUICE_SNAPSHOT_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OWNED="${{ matrix.owned_path }}"
          FOUND=0
          while IFS= read -r manifest; do
            DIR=$(dirname "$manifest")
            if node -e 'const p=require(process.argv[1]); process.exit(p.scripts && p.scripts.test ? 0 : 1)' "./$manifest"; then
              FOUND=1
              echo "Running tests in $DIR"
              npm test --prefix "$DIR"
            fi
          done < <(find "$OWNED" -name package.json -not -path '*/node_modules/*' -print | sort)
          if [[ "$FOUND" -eq 0 ]]; then
            echo "::error::No runnable test script found in owned lane $OWNED"
            exit 1
          fi

      - name: Persist lane snapshot
        if: always() && env.BEETLEJUICE_SNAPSHOT_SAFE == 'true' && env.BEETLEJUICE_SNAPSHOT_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/${BEETLEJUICE_CYCLE_BRANCH}"

  integration:
    name: INTEGRATION DIRECTOR
    needs: [lanes]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download durable lane backups
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: beetlejuice-lane-*-${{ github.run_id }}
          path: /tmp/beetlejuice_lane_artifacts

      - name: Checkout product candidate with binding main policy and mount lanes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          CONTROL=/tmp/beetlejuice-control-plane
          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"
          for path in .github/scripts .opencode AGENTS.md docs; do
            if git cat-file -e "origin/main:${path}" 2>/dev/null; then
              git archive --format=tar origin/main "$path" | tar -xf - -C "$CONTROL"
            fi
          done

          if git ls-remote --exit-code --heads origin refs/heads/lab/integration >/dev/null 2>&1; then
            git fetch origin lab/integration:refs/remotes/origin/lab/integration
            git switch -C lab/integration origin/lab/integration
          else
            git switch -C lab/integration origin/main
          fi
          cp -a "$CONTROL/." .

          for lane in core github privacy product; do
            REMOTE="cycle/${GITHUB_RUN_ID}/${lane}"
            DEST="/tmp/beetlejuice_${lane}"
            ART="/tmp/beetlejuice_lane_artifacts/beetlejuice-lane-${lane}-${GITHUB_RUN_ID}"
            rm -rf "$DEST"
            if git ls-remote --exit-code --heads origin "refs/heads/$REMOTE" >/dev/null 2>&1; then
              git fetch origin "$REMOTE:refs/remotes/origin/$REMOTE"
              git worktree add --detach "$DEST" "origin/$REMOTE"
            elif [[ -d "$ART" ]]; then
              mkdir -p "$DEST"
              cp -a "$ART/." "$DEST/"
              echo "Recovered $lane from workflow artifact because branch snapshot was unavailable."
            else
              mkdir -p "$DEST"
              echo "Lane $lane produced no durable snapshot in run $GITHUB_RUN_ID" > "$DEST/LANE_MISSING.txt"
            fi
          done

      - name: Install OpenCode
        shell: bash
        run: bash .github/scripts/install-opencode-with-retry.sh

      - name: Integrate, repair, and advance active gate
        shell: bash
        run: |
          bash .github/scripts/run-opencode-with-retry.sh run \
            --model "$BEETLEJUICE_MODEL" \
            --agent integration_director \
            "Integrate Factory cycle ${GITHUB_RUN_ID} against binding policy from current main and cumulative progress from lab/integration. Lane snapshots are mounted at /tmp/beetlejuice_core, /tmp/beetlejuice_github, /tmp/beetlejuice_privacy and /tmp/beetlejuice_product. Bring in all useful non-conflicting product progress, repair interfaces/root config/tests as needed, and execute the strongest checks for the active gate in state/factory.json. P0 is green. P0.5 must be proven before P1; after P0_5_READY, integrate P1/next-roadmap work rather than re-running completed P0.5 work. Update state/factory.json only from verified evidence. Never mark real-world gates passed from fixtures or prose. Follow the anti-spin rule and leave one runnable integrated product candidate."

      - name: Verify integrated candidate
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p reports
          npm test
          TEST_RC=$?
          npm run demo
          DEMO_RC=$?
          echo "integration_test_rc=$TEST_RC" > reports/integration-runtime-status.txt
          echo "demo_rc=$DEMO_RC" >> reports/integration-runtime-status.txt
          if [[ "$TEST_RC" -ne 0 || "$DEMO_RC" -ne 0 ]]; then
            echo "::error::Integrated candidate failed verification: tests=$TEST_RC demo=$DEMO_RC"
            exit 1
          fi
          exit 0

      - name: Persist integration branch without policy overlay
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports state
          git config user.name "beetlejuice-integration-director"
          git config user.email "beetlejuice-integration@autonomous.local"
          git add -A -- . \
            ':(exclude).github/scripts/**' \
            ':(exclude).opencode/**' \
            ':(exclude)AGENTS.md' \
            ':(exclude)docs/**'
          git commit -m "Factory ${GITHUB_RUN_ID}: integrate product candidate" || true
          git push origin HEAD:refs/heads/lab/integration

  audit:
    name: ADVERSARIAL ACTIVE-GATE AUDIT
    needs: [integration]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mount integration candidate with binding main policy
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CONTROL=/tmp/beetlejuice-control-plane
          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"
          for path in .github/scripts .opencode AGENTS.md docs; do
            if git cat-file -e "origin/main:${path}" 2>/dev/null; then
              git archive --format=tar origin/main "$path" | tar -xf - -C "$CONTROL"
            fi
          done
          git fetch origin lab/integration:refs/remotes/origin/lab/integration
          git switch -C "cycle/${GITHUB_RUN_ID}/audit" origin/lab/integration
          cp -a "$CONTROL/." .

      - name: Install OpenCode
        shell: bash
        run: bash .github/scripts/install-opencode-with-retry.sh

      - name: Audit active product gate adversarially
        shell: bash
        run: |
          bash .github/scripts/run-opencode-with-retry.sh run \
            --model "$BEETLEJUICE_MODEL" \
            --agent product_auditor \
            "Adversarially audit the integrated Beetlejuice candidate from Factory cycle ${GITHUB_RUN_ID} against the active gate in durable state and binding workcards/objective. While P0.5 is unfinished, falsify WC-007 architecture reconstruction fidelity, topology/policy representation, provenance confidence, real HTTPS ingestion, pagination/rate-limit/network handling, classification/outcome attribution, certain structural-waste precision, unlinkable privacy export, billing honesty and later billing attachment. Once P0_5_READY is verified, audit P1 and subsequent active roadmap claims instead of repeating completed P0.5 work. Write reports/latest-product-audit.md and any gate-specific executed-evidence report. Never mark a gate passed from fixtures/prose when real evidence is required."

      - name: Persist audit snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "beetlejuice-product-auditor"
          git config user.email "beetlejuice-auditor@autonomous.local"
          git add reports || true
          git commit -m "Factory ${GITHUB_RUN_ID}: adversarial active-gate audit" || true
          git push --force origin "HEAD:refs/heads/cycle/${GITHUB_RUN_ID}/audit"

  direction:
    name: PRODUCT DIRECTOR — CONTINUE OR GATE
    needs: [integration, audit]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout durable integration with binding main policy and mount audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CONTROL=/tmp/beetlejuice-control-plane
          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"
          for path in .github/scripts .opencode AGENTS.md docs; do
            if git cat-file -e "origin/main:${path}" 2>/dev/null; then
              git archive --format=tar origin/main "$path" | tar -xf - -C "$CONTROL"
            fi
          done
          git fetch origin lab/integration:refs/remotes/origin/lab/integration
          git switch -C lab/integration origin/lab/integration
          cp -a "$CONTROL/." .
          AUDIT="cycle/${GITHUB_RUN_ID}/audit"
          if git ls-remote --exit-code --heads origin "refs/heads/$AUDIT" >/dev/null 2>&1; then
            git fetch origin "$AUDIT:refs/remotes/origin/$AUDIT"
            git show "origin/$AUDIT:reports/latest-product-audit.md" > reports/latest-product-audit.md 2>/dev/null || true
            git show "origin/$AUDIT:reports/real-world-robustness.md" > reports/real-world-robustness.md 2>/dev/null || true
          fi

      - name: Install OpenCode
        shell: bash
        run: bash .github/scripts/install-opencode-with-retry.sh

      - name: Set evidence-gated autonomous direction
        shell: bash
        run: |
          bash .github/scripts/run-opencode-with-retry.sh run \
            --model "$BEETLEJUICE_MODEL" \
            --agent product_director \
            "Close Factory cycle ${GITHUB_RUN_ID} using binding current-main policy and cumulative lab/integration state. Determine the highest-priority unfinished gate from state/factory.json, docs/PRODUCT_OBJECTIVE.md and workcards. P0 is verified. Until P0_5_READY is defensible, P0.5 outranks P1. Once P0.5 is green, advance P1 and then subsequent declared roadmap work; never keep cycling a completed gate. Update state/factory.json truthfully from executed evidence. If any gap is buildable in-repo, keep continue=true and next_action must name the highest-value concrete next experiment/repair/capability. Follow the anti-spin rule after a zero-delta cycle. Never stop because a lane/test/network/provider call failed. Only request human action after every safe repo-local route is exhausted. COMPLETE requires all declared check groups green plus terminal_ready=true and must not be used as a convenience stop."

      - name: Validate liveness and persist factory state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f state/factory.json || { echo "::error::Missing state/factory.json"; exit 1; }
          STATUS=$(jq -r '.status // empty' state/factory.json)
          CONTINUE=$(jq -r '.continue // empty' state/factory.json)
          REQUIRES_USER=$(jq -r '.requires_user_action // false' state/factory.json)
          LOCAL_EXHAUSTED=$(jq -r '.repo_local_work_exhausted // false' state/factory.json)
          TERMINAL_READY=$(jq -r '.terminal_ready // false' state/factory.json)
          REMAINING=$(jq '[to_entries[] | select(.key | endswith("_checks")) | select(.value | type == "object") | .value | to_entries[] | select(.value == false)] | length' state/factory.json)
          CHECK_GROUPS=$(jq '[to_entries[] | select(.key | endswith("_checks")) | select(.value | type == "object")] | length' state/factory.json)

          case "$STATUS" in BUILDING|INTEGRATING|BLOCKED_EXTERNAL|P0_READY|P0_5_READY|COMPLETE) ;; *) echo "::error::Invalid factory status: $STATUS"; exit 1;; esac
          case "$CONTINUE" in true|false) ;; *) echo "::error::Invalid continue flag"; exit 1;; esac

          # No LLM may silently stop useful repo-local work. Normalize premature
          # stop states before persistence; the supervisor independently enforces
          # the same terminal predicate as a second line of defense.
          if [[ "$STATUS" == "COMPLETE" && ! ( "$REMAINING" -eq 0 && "$CHECK_GROUPS" -gt 0 && "$TERMINAL_READY" == true ) ]]; then
            echo "::warning::Premature COMPLETE rejected: remaining=$REMAINING terminal_ready=$TERMINAL_READY"
            STATUS=BUILDING
            CONTINUE=true
          fi
          if [[ "$CONTINUE" != true && ! ( "$STATUS" == "COMPLETE" || ( "$REQUIRES_USER" == true && "$LOCAL_EXHAUSTED" == true ) ) ]]; then
            echo "::warning::Premature continue=false rejected while repo-local work may remain."
            CONTINUE=true
          fi
          if [[ "$STATUS" == "BLOCKED_EXTERNAL" && ! ( "$REQUIRES_USER" == true && "$LOCAL_EXHAUSTED" == true ) ]]; then
            echo "::warning::BLOCKED_EXTERNAL is non-terminal while repo-local work remains."
            STATUS=BUILDING
            CONTINUE=true
          fi

          TMP=$(mktemp)
          jq --arg commit "$(git rev-parse HEAD)" \
             --argjson cycle "${GITHUB_RUN_ID}" \
             --arg status "$STATUS" \
             --argjson cont "$CONTINUE" \
             '.last_verified_commit=$commit | .cycle=$cycle | .status=$status | .continue=$cont' \
             state/factory.json > "$TMP"
          mv "$TMP" state/factory.json
          git config user.name "beetlejuice-product-director"
          git config user.email "beetlejuice-director@autonomous.local"
          git add state reports || true
          git commit -m "Factory ${GITHUB_RUN_ID}: autonomous product direction" || true
          git push origin HEAD:refs/heads/lab/integration
