name: BEETLEJUICE Autonomous Continuation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-loop.yml'
      - '.opencode/agents/product_director.md'

permissions:
  contents: write
  actions: read

concurrency:
  group: beetlejuice-product-factory
  # A control-plane edit replaces the obsolete implementation immediately.
  # Normal scheduled ticks never interrupt useful work already in progress.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  continue-product:
    name: Continue Beetlejuice product
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout the single durable branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure repository writer
        shell: bash
        run: |
          git config user.name "beetlejuice-autonomous-director"
          git config user.email "beetlejuice-autonomous@users.noreply.github.com"

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL https://opencode.ai/install | bash; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::OpenCode installation failed after 3 attempts"
              exit 70
            fi
            sleep $((attempt * 10))
          done
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Advance the product from durable repo truth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          OPENCODE="$HOME/.opencode/bin/opencode"
          MODELS=(
            "opencode/x-preview-f-free"
            "opencode/nemotron-3.5-lightning-free"
            "opencode/hy3-free"
          )
          MAX_ROUNDS=3

          terminal_state() {
            [[ -f state/factory.json ]] || return 1
            local status continue_flag false_gates check_groups
            status=$(jq -r '.status // "BUILDING"' state/factory.json 2>/dev/null || echo BUILDING)
            continue_flag=$(jq -r '.continue // true' state/factory.json 2>/dev/null || echo true)
            check_groups=$(jq '[to_entries[] | select(.key | endswith("_checks")) | select(.value | type == "object")] | length' state/factory.json 2>/dev/null || echo 0)
            false_gates=$(jq '[to_entries[] | select(.key | endswith("_checks")) | select(.value | type == "object") | .value | to_entries[] | select(.value == false)] | length' state/factory.json 2>/dev/null || echo 999)
            [[ "$status" == "COMPLETE" && "$continue_flag" == "false" && "$check_groups" -gt 0 && "$false_gates" -eq 0 ]]
          }

          for ROUND in $(seq 1 "$MAX_ROUNDS"); do
            echo "===== AUTONOMOUS ROUND $ROUND/$MAX_ROUNDS ====="
            git fetch origin main
            git reset --hard origin/main

            if terminal_state; then
              echo "BEETLEJUICE_TERMINAL_STATE_VERIFIED"
              exit 0
            fi

            ROUND_COMMITTED=false

            for MODEL in "${MODELS[@]}"; do
              echo "Trying autonomous director with model=$MODEL"

              PROMPT=$(cat <<'EOF'
          You are the sole autonomous continuation agent for BEETLEJUICE. There are no lanes, no supervisor, no integration director, and no other agent that will finish your work later.

          Read AGENTS.md, docs/MASTER_PROMPT.md, docs/PRODUCT_OBJECTIVE.md, docs/agents/AGENT_CARDS.md, every workcard, state/factory.json, existing reports, tests, and the actual implementation before deciding what to do.

          The durable objective from the project conversation is binding: build the actual Beetlejuice product. P0 is already established. P0.5 real-world architecture-learning evidence is the active gate before P1 unless the repository contains executed evidence proving otherwise. The primary learned object is automation architecture; billing is a tenant-local calibration/economic-label layer. Do not turn the project into a token dashboard. Do not invent real-world evidence, monetary evidence, causality, or completion.

          In this invocation, identify the single highest-value unfinished repo-local action and IMPLEMENT IT end-to-end. Prefer concrete code, executable evidence collection, tests, real public GitHub evidence, architecture reconstruction, privacy-safe export, or the next product capability over prose. If the active gate requires public GitHub evidence, you may use GH_TOKEN/gh/curl and the network. A provider outage, a failed previous workflow, or missing optional billing credentials is never a reason to stop repo-local work.

          You may edit anywhere in the product repository that is needed, including packages, apps, tests, reports, docs, and state/factory.json. Do NOT modify anything under .github/workflows or .github/scripts. Do NOT create cycle branches, do NOT use lab/integration, and do NOT git commit or push; the workflow owns persistence. Work directly on the checked-out main candidate.

          Before returning, run the relevant tests yourself. Update state/factory.json only to facts supported by executed evidence. Keep continue=true unless the product is genuinely COMPLETE with every declared check group true. Never claim a gate from fixtures or prose when it requires executed real-world evidence. If an approach yields no durable delta, change strategy within this invocation rather than returning empty-handed.
          EOF
          )

              LOG="/tmp/beetlejuice-opencode-${ROUND}-$(echo "$MODEL" | tr '/:' '__').log"
              set +e
              timeout 14m "$OPENCODE" run --model "$MODEL" --agent product_director "$PROMPT" 2>&1 | tee "$LOG"
              RC=${PIPESTATUS[0]}
              set -e

              if [[ "$RC" -ne 0 ]]; then
                echo "::warning::model=$MODEL failed rc=$RC; moving to the next free model without long sleep"
                sleep 5
                continue
              fi

              # The automation itself is immutable to its agent. Product work may never
              # silently rewrite the mechanism keeping the project alive.
              git restore --source=HEAD --staged --worktree .github/workflows 2>/dev/null || true
              git restore --source=HEAD --staged --worktree .github/scripts 2>/dev/null || true

              if git diff --quiet && git diff --cached --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
                if terminal_state; then
                  echo "BEETLEJUICE_TERMINAL_STATE_VERIFIED_AFTER_AGENT"
                  exit 0
                fi
                echo "::warning::model=$MODEL returned success with zero durable delta; trying the next model"
                continue
              fi

              echo "Validating candidate produced by model=$MODEL"
              npm install --ignore-scripts --no-audit --no-fund --silent
              set +e
              npm test
              TEST_RC=$?
              npm run demo
              DEMO_RC=$?
              set -e

              if [[ "$TEST_RC" -ne 0 || "$DEMO_RC" -ne 0 ]]; then
                echo "::warning::candidate from model=$MODEL is not green (test=$TEST_RC demo=$DEMO_RC); next model must repair the same worktree"
                continue
              fi

              git add -A
              if git diff --cached --quiet; then
                echo "::warning::validated candidate contains no committable delta; trying next model"
                continue
              fi

              git commit -m "factory: autonomous product progress ${GITHUB_RUN_ID}.${ROUND}"

              # A human/control-plane edit may have landed while the agent worked. Rebase
              # rather than overwriting it. If conflict occurs, fail visibly; the next
              # scheduled tick starts from repository truth again.
              git pull --rebase origin main
              git push origin HEAD:main
              echo "BEETLEJUICE_PROGRESS_COMMITTED round=$ROUND model=$MODEL head=$(git rev-parse HEAD)"
              ROUND_COMMITTED=true
              break
            done

            if [[ "$ROUND_COMMITTED" != true ]]; then
              echo "::error::No model produced tested durable progress in round $ROUND. The scheduled workflow will retry from main on the next tick."
              exit 68
            fi
          done

          echo "Completed $MAX_ROUNDS productive rounds; next scheduled tick will continue from main."
