name: BEETLEJUICE Factory Supervisor

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "BEETLEJUICE Product Factory"
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-supervisor.yml'
      - '.github/workflows/factory-loop.yml'
      - '.github/scripts/run-opencode-with-retry.sh'
      - 'state/factory.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: beetlejuice-factory-supervisor
  cancel-in-progress: false

jobs:
  continuity:
    name: Ensure autonomous product continuity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Housekeep obsolete runs and cycle branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          KEEP_PER_ACTIVE_WORKFLOW=3
          ACTIVE_NAMES=(
            "BEETLEJUICE Product CI"
            "BEETLEJUICE Product Factory"
            "BEETLEJUICE Factory Supervisor"
          )

          STATE=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/state/factory.json?ref=main" 2>/dev/null || echo '{}')
          PRESERVE_IDS=$(jq -r '
            .. | objects | to_entries[]?
            | select(.key | test("run_id$"))
            | .value
            | select(type == "number")
          ' <<<"$STATE" 2>/dev/null | sort -u || true)

          mapfile -t RUN_ROWS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id,.name,.status,.created_at] | @tsv'
          )

          is_active_name() {
            local candidate="$1"
            for active in "${ACTIVE_NAMES[@]}"; do
              [[ "$candidate" == "$active" ]] && return 0
            done
            return 1
          }

          is_evidence_run() {
            local candidate="$1"
            grep -qx "$candidate" <<<"$PRESERVE_IDS" 2>/dev/null
          }

          declare -A KEPT_BY_NAME=()
          DELETED_RUNS=0
          for row in "${RUN_ROWS[@]}"; do
            IFS=$'\t' read -r RUN_ID RUN_NAME RUN_STATUS CREATED_AT <<<"$row"
            [[ -n "$RUN_ID" ]] || continue
            [[ "$RUN_STATUS" == "completed" ]] || continue

            if is_evidence_run "$RUN_ID"; then
              continue
            fi

            if is_active_name "$RUN_NAME"; then
              COUNT=${KEPT_BY_NAME["$RUN_NAME"]:-0}
              if (( COUNT < KEEP_PER_ACTIVE_WORKFLOW )); then
                KEPT_BY_NAME["$RUN_NAME"]=$((COUNT + 1))
                continue
              fi
            fi

            if gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" >/dev/null 2>&1; then
              DELETED_RUNS=$((DELETED_RUNS + 1))
            fi
          done

          # cycle/<run-id>/<lane> refs are disposable transport branches. Product
          # progress must already live on lab/integration before a cycle completes.
          ACTIVE_FACTORY_IDS=$(printf '%s\n' "${RUN_ROWS[@]}" | awk -F '\t' \
            '$2 == "BEETLEJUICE Product Factory" && $3 != "completed" {print $1}' | sort -u)

          mapfile -t CYCLE_REFS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/cycle/" \
              --jq '.[].ref' 2>/dev/null || true
          )

          DELETED_BRANCHES=0
          for REF in "${CYCLE_REFS[@]}"; do
            [[ "$REF" == refs/heads/cycle/* ]] || continue
            SHORT=${REF#refs/heads/}
            RUN_ID=$(cut -d/ -f2 <<<"$SHORT")
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || continue

            if grep -qx "$RUN_ID" <<<"$ACTIVE_FACTORY_IDS" 2>/dev/null; then
              continue
            fi
            if is_evidence_run "$RUN_ID"; then
              continue
            fi

            if gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${SHORT}" >/dev/null 2>&1; then
              DELETED_BRANCHES=$((DELETED_BRANCHES + 1))
            fi
          done

          echo "Housekeeping complete: deleted_runs=$DELETED_RUNS deleted_cycle_branches=$DELETED_BRANCHES"

      - name: Recover stale cycles, preserve durable state, and relaunch work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(date +%s)

          cancel_run() {
            local id="$1" reason="$2"
            echo "Cancelling factory run $id: $reason"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" >/dev/null 2>&1 || true
          }

          load_runs() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow factory-loop.yml --limit 100 \
              --json databaseId,status,conclusion,createdAt,headSha 2>/dev/null || echo '[]'
          }

          RUNS=$(load_runs)

          # A control-plane update invalidates older active cycles.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            CHANGED=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
              --jq '.files[]?.filename' 2>/dev/null || true)
            if grep -Eq '^(\.github/workflows/factory-loop\.yml|\.github/scripts/run-opencode-with-retry\.sh|\.github/workflows/factory-supervisor\.yml)$' <<<"$CHANGED"; then
              while IFS= read -r RUN_ID; do
                [[ -n "$RUN_ID" ]] || continue
                RUN_SHA=$(jq -r --argjson id "$RUN_ID" \
                  '.[] | select(.databaseId == $id) | .headSha' <<<"$RUNS")
                [[ "$RUN_SHA" == "$GITHUB_SHA" ]] || \
                  cancel_run "$RUN_ID" "stale control-plane revision $RUN_SHA"
              done < <(jq -r '.[] | select(.status != "completed") | .databaseId' <<<"$RUNS")
              sleep 5
              RUNS=$(load_runs)
            fi
          fi

          # GitHub-level watchdog. Per-call Ox stalls are handled inside the
          # OpenCode wrapper; this catches queue starvation and whole-run zombies.
          while IFS=$'\t' read -r RUN_ID RUN_STATUS CREATED_AT; do
            [[ -n "$RUN_ID" ]] || continue
            CREATED_EPOCH=$(date -d "$CREATED_AT" +%s 2>/dev/null || echo "$NOW")
            AGE_MIN=$(( (NOW - CREATED_EPOCH) / 60 ))
            case "$RUN_STATUS" in
              queued|pending|waiting|requested)
                (( AGE_MIN > 45 )) && cancel_run "$RUN_ID" "queued/pending for ${AGE_MIN}m"
                ;;
              in_progress)
                (( AGE_MIN > 480 )) && cancel_run "$RUN_ID" "workflow zombie older than ${AGE_MIN}m"
                ;;
            esac
          done < <(jq -r '.[] | select(.status != "completed") | [.databaseId,.status,.createdAt] | @tsv' <<<"$RUNS")

          sleep 5
          RUNS=$(load_runs)
          ACTIVE=$(jq '[.[] | select(.status != "completed")] | length' <<<"$RUNS")
          if [[ "$ACTIVE" -gt 0 ]]; then
            echo "A current factory cycle is alive; continuity satisfied."
            exit 0
          fi

          # main owns policy/control-plane. lab/integration owns cumulative product
          # progress. Merge the latter into main so no cycle can regress state.
          MAIN_META=$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/factory.json?ref=main" 2>/dev/null || echo '{}')
          MAIN_SHA=$(jq -r '.sha // empty' <<<"$MAIN_META")
          MAIN_STATE=$(jq -r '.content // empty' <<<"$MAIN_META" | tr -d '\n' | base64 -d 2>/dev/null || echo '{}')

          INTEGRATION_STATE='{}'
          if gh api "repos/${GITHUB_REPOSITORY}/branches/lab%2Fintegration" >/dev/null 2>&1; then
            INT_META=$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/factory.json?ref=lab/integration" 2>/dev/null || echo '{}')
            INTEGRATION_STATE=$(jq -r '.content // empty' <<<"$INT_META" | tr -d '\n' | base64 -d 2>/dev/null || echo '{}')
          fi

          MAIN_CYCLE=$(jq -r '.cycle // 0' <<<"$MAIN_STATE" 2>/dev/null || echo 0)
          INT_CYCLE=$(jq -r '.cycle // 0' <<<"$INTEGRATION_STATE" 2>/dev/null || echo 0)

          if [[ "$INT_CYCLE" =~ ^[0-9]+$ && "$MAIN_CYCLE" =~ ^[0-9]+$ ]] && (( INT_CYCLE >= MAIN_CYCLE )); then
            MERGED_STATE=$(jq -S -s '.[0] * .[1]' \
              <(printf '%s' "$MAIN_STATE") <(printf '%s' "$INTEGRATION_STATE"))
          else
            MERGED_STATE=$(jq -S . <<<"$MAIN_STATE")
          fi

          MAIN_CANON=$(jq -S . <<<"$MAIN_STATE" 2>/dev/null || echo '{}')
          if [[ -n "$MAIN_SHA" && "$MERGED_STATE" != "$MAIN_CANON" ]]; then
            ENCODED=$(printf '%s' "$MERGED_STATE" | base64 -w0)
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/state/factory.json" \
              -f message='factory: sync durable autonomous progress state' \
              -f content="$ENCODED" \
              -f sha="$MAIN_SHA" \
              -f branch=main >/dev/null
            echo "Durable integration state synchronized to main; push-triggered factory will continue from it."
            exit 0
          fi

          STATE="$MERGED_STATE"
          STATUS=$(jq -r '.status // "BUILDING"' <<<"$STATE")
          CONTINUE=$(jq -r '.continue // true' <<<"$STATE")
          NEXT_ACTION=$(jq -r '.next_action // "CONTINUE_HIGHEST_VALUE_UNFINISHED_WORK"' <<<"$STATE")
          REQUIRES_USER=$(jq -r '.requires_user_action // false' <<<"$STATE")
          LOCAL_EXHAUSTED=$(jq -r '.repo_local_work_exhausted // false' <<<"$STATE")
          TERMINAL_READY=$(jq -r '.terminal_ready // false' <<<"$STATE")
          CHECK_GROUPS=$(jq '[to_entries[] | select(.key | endswith("_checks")) | select(.value | type == "object")] | length' <<<"$STATE")
          REMAINING=$(jq '[to_entries[] | select(.key | endswith("_checks")) | select(.value | type == "object") | .value | to_entries[] | select(.value == false)] | length' <<<"$STATE")

          # LLM-written COMPLETE is advisory unless machine gates prove it.
          if [[ "$STATUS" == "COMPLETE" && "$REMAINING" -eq 0 && "$CHECK_GROUPS" -gt 0 && "$TERMINAL_READY" == true ]]; then
            echo "Factory terminal predicate satisfied."
            exit 0
          fi

          if [[ "$STATUS" == "COMPLETE" ]]; then
            echo "::warning::Rejecting premature COMPLETE: check_groups=$CHECK_GROUPS remaining_false_gates=$REMAINING terminal_ready=$TERMINAL_READY"
            STATUS="BUILDING"
            CONTINUE=true
          fi

          # Human pause is valid only after every repo-local avenue is exhausted.
          if [[ "$REQUIRES_USER" == true && "$LOCAL_EXHAUSTED" == true ]]; then
            echo "All repo-local work exhausted and explicit human action required. Pausing safely. next_action=$NEXT_ACTION"
            exit 0
          fi

          if [[ "$CONTINUE" != true || "$STATUS" == "BLOCKED_EXTERNAL" ]]; then
            echo "Overriding non-terminal stop: status=$STATUS continue=$CONTINUE remaining_false_gates=$REMAINING"
          fi

          echo "Relaunching autonomous Beetlejuice factory: status=$STATUS remaining_false_gates=$REMAINING next_action=$NEXT_ACTION"
          gh workflow run factory-loop.yml --repo "$GITHUB_REPOSITORY" --ref main
