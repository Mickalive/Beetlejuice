name: BEETLEJUICE Product Factory

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: beetlejuice-product-factory
  cancel-in-progress: false

env:
  BEETLEJUICE_MODEL: opencode/x-preview-f-free

jobs:
  lanes:
    name: "BUILD — ${{ matrix.lane }}"
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core
            agent: core_builder
            owned_path: packages/core
            mission: "Advance the P0.5 architecture-first model: represent automation topology/policies, task context, outcomes, structural waste and later billing labels without making cost the primary explanatory signal."
          - lane: github
            agent: github_builder
            owned_path: packages/github
            mission: "Advance P0.5 real-GitHub evidence: reconstruct identifiable agent/task/model provenance and automation architecture from real HTTPS history, with correlation confidence, pagination, rate-limit/network resilience and safe abstention."
          - lane: privacy
            agent: privacy_builder
            owned_path: packages/privacy
            mission: "Advance the P0.5 privacy-safe global architecture-learning export: unlinkable abstract topology/task/outcome/resource fields plus rights-cleared generalized economic labels, with re-identification defenses."
          - lane: product
            agent: product_builder
            owned_path: apps
            mission: "Advance the P0.5 architecture-first user surface and executed real-world robustness evidence: explain architecture and structural inefficiency without full billing, then attach partial/complete real billing honestly as local calibration."

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Start product lane with binding main control plane
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          CONTROL=/tmp/beetlejuice-control-plane
          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"
          for path in .github/scripts .opencode AGENTS.md docs state/factory.json; do
            if git cat-file -e "origin/main:${path}" 2>/dev/null; then
              git archive --format=tar origin/main "$path" | tar -xf - -C "$CONTROL"
            fi
          done

          if git ls-remote --exit-code --heads origin refs/heads/lab/integration >/dev/null 2>&1; then
            git fetch origin lab/integration:refs/remotes/origin/lab/integration
            BASE=origin/lab/integration
          else
            BASE=origin/main
          fi
          BASE_SHA=$(git rev-parse "$BASE")
          BRANCH="cycle/${GITHUB_RUN_ID}/${{ matrix.lane }}"
          git switch -C "$BRANCH" "$BASE_SHA"
          cp -a "$CONTROL/." .

          echo "BEETLEJUICE_CYCLE_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "BEETLEJUICE_CYCLE_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Install OpenCode
        shell: bash
        run: bash .github/scripts/install-opencode-with-retry.sh

      - name: Run lane agent with resilient retry
        shell: bash
        run: |
          bash .github/scripts/run-opencode-with-retry.sh run \
            --model "$BEETLEJUICE_MODEL" \
            --agent "${{ matrix.agent }}" \
            "${{ matrix.mission }} Work only on the already-checked-out cycle branch from the immutable integration product base. The binding control plane (.opencode, AGENTS.md, docs, state/factory.json and runtime scripts) has been overlaid from current main and outranks stale copies from the product branch. P0 is already green; P0.5 architecture-learning and billing-calibration viability outrank P1 until the real-world gate is executed. Produce durable tested product progress inside your owned path ${{ matrix.owned_path }}. Do NOT git fetch, pull, merge, rebase, cherry-pick, switch, checkout or reset to another ref. Do NOT modify .github/**, docs/**, AGENTS.md or state/**. Inspect state/factory.json only as read-only context; do not declare global product completion. Never put credential-shaped literal fixtures (Slack/GitHub/AWS/API tokens or similar) in source or tests; construct fake sensitive values from harmless fragments at runtime. If the obvious task is already implemented, find the next missing P0.5 acceptance criterion in WC-007 and advance it."

      - name: Repair credential-shaped fixtures before persistence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "BEETLEJUICE_SNAPSHOT_SAFE=false" >> "$GITHUB_ENV"
          OWNED="${{ matrix.owned_path }}"
          [[ -d "$OWNED" ]] || { echo "::error::Owned path missing: $OWNED"; exit 1; }
          MATCHES=$(grep -RIlE 'xox[baprs]-[A-Za-z0-9-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' "$OWNED" --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null || true)
          REPAIR_RC=0
          if [[ -n "$MATCHES" ]]; then
            printf 'Credential-shaped literals detected in:\n%s\n' "$MATCHES"
            bash .github/scripts/run-opencode-with-retry.sh run \
              --model "$BEETLEJUICE_MODEL" \
              --agent "${{ matrix.agent }}" \
              "Before this lane can be persisted, remove every credential-shaped literal from these owned-lane files: ${MATCHES//$'\n'/, }. Preserve the test intent by constructing fake values from harmless string fragments at runtime. Do not expose or print the sensitive-looking values. Work only inside $OWNED; do not fetch/merge/rebase or modify the control plane. Re-run the affected tests." || REPAIR_RC=$?
          fi
          REMAINING=$(grep -RIlE 'xox[baprs]-[A-Za-z0-9-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' "$OWNED" --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null || true)
          if [[ "$REPAIR_RC" -ne 0 || -n "$REMAINING" ]]; then
            echo "::error::Lane is not safe to persist; credential-shaped fixture repair failed or literals remain."
            exit 1
          fi
          echo "BEETLEJUICE_SNAPSHOT_SAFE=true" >> "$GITHUB_ENV"

      - name: Rebuild hermetic lane snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "BEETLEJUICE_SNAPSHOT_READY=false" >> "$GITHUB_ENV"
          OWNED="${{ matrix.owned_path }}"
          SNAP="/tmp/beetlejuice-owned-${{ matrix.lane }}"
          [[ -d "$OWNED" ]] || { echo "::error::Owned path missing: $OWNED"; exit 1; }
          rm -rf "$SNAP"
          mkdir -p "$SNAP/$(dirname "$OWNED")"
          cp -a "$OWNED" "$SNAP/$OWNED"

          git reset --hard "$BEETLEJUICE_CYCLE_BASE_SHA"
          git clean -fdx
          rm -rf "$OWNED"
          mkdir -p "$(dirname "$OWNED")"
          cp -a "$SNAP/$OWNED" "$OWNED"

          git config user.name "beetlejuice-${{ matrix.lane }}-builder"
          git config user.email "beetlejuice-${{ matrix.lane }}@autonomous.local"
          git add -- "$OWNED"
          git commit -m "Factory ${GITHUB_RUN_ID}: ${{ matrix.lane }} hermetic lane" || true

          BAD=$(git diff --name-only "$BEETLEJUICE_CYCLE_BASE_SHA"..HEAD | grep -vE '^${{ matrix.owned_path }}(/|$)' || true)
          if [[ -n "$BAD" ]]; then
            echo "::error::Hermetic snapshot contains out-of-lane files:"
            echo "$BAD"
            exit 1
          fi
          echo "BEETLEJUICE_SNAPSHOT_READY=true" >> "$GITHUB_ENV"

      - name: Archive lane snapshot before tests and push
        if: always() && env.BEETLEJUICE_SNAPSHOT_SAFE == 'true' && env.BEETLEJUICE_SNAPSHOT_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beetlejuice-lane-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ matrix.owned_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Install workspace for hermetic tests
        if: always() && env.BEETLEJUICE_SNAPSHOT_READY == 'true'
        shell: bash
        run: npm install --ignore-scripts

      - name: Run real lane tests
        if: always() && env.BEETLEJUICE_SNAPSHOT_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OWNED="${{ matrix.owned_path }}"
          FOUND=0
          while IFS= read -r manifest; do
            DIR=$(dirname "$manifest")
            if node -e 'const p=require(process.argv[1]); process.exit(p.scripts && p.scripts.test ? 0 : 1)' "./$manifest"; then
              FOUND=1
              echo "Running tests in $DIR"
              npm test --prefix "$DIR"
            fi
          done < <(find "$OWNED" -name package.json -not -path '*/node_modules/*' -print | sort)
          if [[ "$FOUND" -eq 0 ]]; then
            echo "::error::No runnable test script found in owned lane $OWNED"
            exit 1
          fi

      - name: Persist lane snapshot
        if: always() && env.BEETLEJUICE_SNAPSHOT_SAFE == 'true' && env.BEETLEJUICE_SNAPSHOT_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/${BEETLEJUICE_CYCLE_BRANCH}"

  integration:
    name: INTEGRATION DIRECTOR
    needs: [lanes]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download durable lane backups
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: beetlejuice-lane-*-${{ github.run_id }}
          path: /tmp/beetlejuice_lane_artifacts

      - name: Checkout product candidate with binding main control plane and mount lanes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          CONTROL=/tmp/beetlejuice-control-plane
          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"
          for path in .github/scripts .opencode AGENTS.md docs state/factory.json; do
            if git cat-file -e "origin/main:${path}" 2>/dev/null; then
              git archive --format=tar origin/main "$path" | tar -xf - -C "$CONTROL"
            fi
          done

          if git ls-remote --exit-code --heads origin refs/heads/lab/integration >/dev/null 2>&1; then
            git fetch origin lab/integration:refs/remotes/origin/lab/integration
            git switch -C lab/integration origin/lab/integration
          else
            git switch -C lab/integration origin/main
          fi
          cp -a "$CONTROL/." .

          for lane in core github privacy product; do
            REMOTE="cycle/${GITHUB_RUN_ID}/${lane}"
            DEST="/tmp/beetlejuice_${lane}"
            ART="/tmp/beetlejuice_lane_artifacts/beetlejuice-lane-${lane}-${GITHUB_RUN_ID}"
            rm -rf "$DEST"
            if git ls-remote --exit-code --heads origin "refs/heads/$REMOTE" >/dev/null 2>&1; then
              git fetch origin "$REMOTE:refs/remotes/origin/$REMOTE"
              git worktree add --detach "$DEST" "origin/$REMOTE"
            elif [[ -d "$ART" ]]; then
              mkdir -p "$DEST"
              cp -a "$ART/." "$DEST/"
              echo "Recovered $lane from workflow artifact because branch snapshot was unavailable."
            else
              mkdir -p "$DEST"
              echo "Lane $lane produced no durable snapshot in run $GITHUB_RUN_ID" > "$DEST/LANE_MISSING.txt"
            fi
          done

      - name: Install OpenCode
        shell: bash
        run: bash .github/scripts/install-opencode-with-retry.sh

      - name: Integrate and repair
        shell: bash
        run: |
          bash .github/scripts/run-opencode-with-retry.sh run \
            --model "$BEETLEJUICE_MODEL" \
            --agent integration_director \
            "Integrate Factory cycle ${GITHUB_RUN_ID} against the binding P0.5 architecture-first state from current main. Lane snapshots are mounted at /tmp/beetlejuice_core, /tmp/beetlejuice_github, /tmp/beetlejuice_privacy and /tmp/beetlejuice_product. Bring in all useful non-conflicting product progress, repair interfaces/root config/tests as needed, and execute the strongest available P0.5 checks. P0 is already green. Prioritize architecture reconstruction/topology, identifiable real-repo evidence, structural-waste precision, privacy-safe architecture export, and later attachment of real billing without schema redesign. Update state/factory.json only from verified evidence; do not mark P0_5_READY from fixtures or prose. Leave one runnable integrated product candidate."

      - name: Verify integrated candidate
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p reports
          npm test
          TEST_RC=$?
          npm run demo
          DEMO_RC=$?
          echo "integration_test_rc=$TEST_RC" > reports/integration-runtime-status.txt
          echo "demo_rc=$DEMO_RC" >> reports/integration-runtime-status.txt
          if [[ "$TEST_RC" -ne 0 || "$DEMO_RC" -ne 0 ]]; then
            echo "::error::Integrated candidate failed verification: tests=$TEST_RC demo=$DEMO_RC"
            exit 1
          fi
          exit 0

      - name: Persist integration branch without control-plane overlay
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports state
          git config user.name "beetlejuice-integration-director"
          git config user.email "beetlejuice-integration@autonomous.local"
          git add -A -- . \
            ':(exclude).github/scripts/**' \
            ':(exclude).opencode/**' \
            ':(exclude)AGENTS.md' \
            ':(exclude)docs/**'
          git commit -m "Factory ${GITHUB_RUN_ID}: integrate product candidate" || true
          git push origin HEAD:refs/heads/lab/integration

  audit:
    name: ADVERSARIAL P0.5 ARCHITECTURE AUDIT
    needs: [integration]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mount integration candidate with binding main control plane
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CONTROL=/tmp/beetlejuice-control-plane
          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"
          for path in .github/scripts .opencode AGENTS.md docs state/factory.json; do
            if git cat-file -e "origin/main:${path}" 2>/dev/null; then
              git archive --format=tar origin/main "$path" | tar -xf - -C "$CONTROL"
            fi
          done
          git fetch origin lab/integration:refs/remotes/origin/lab/integration
          git switch -C "cycle/${GITHUB_RUN_ID}/audit" origin/lab/integration
          cp -a "$CONTROL/." .

      - name: Install OpenCode
        shell: bash
        run: bash .github/scripts/install-opencode-with-retry.sh

      - name: Audit P0.5 architecture learning and robustness
        shell: bash
        run: |
          bash .github/scripts/run-opencode-with-retry.sh run \
            --model "$BEETLEJUICE_MODEL" \
            --agent product_auditor \
            "Adversarially audit the integrated Beetlejuice candidate from Factory cycle ${GITHUB_RUN_ID} against WC-007 and the binding architecture-first P0.5 state. Run product/tests and falsify: architecture reconstruction fidelity; topology/policy representation; agent/task/model provenance confidence; real HTTPS ingestion; pagination/rate-limit/network handling; classification/outcome attribution; certain structural-waste precision; privacy-safe unlinkable architecture export; no/partial/complete billing honesty; and ability to attach later real billing without schema redesign. The primary corpus must be high-identifiability and messy cases must remain a separate robustness set. Write reports/latest-product-audit.md and, when executed real-corpus evidence exists, reports/real-world-robustness.md. Never mark a gate passed from fixtures alone."

      - name: Persist audit snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "beetlejuice-product-auditor"
          git config user.email "beetlejuice-auditor@autonomous.local"
          git add reports || true
          git commit -m "Factory ${GITHUB_RUN_ID}: adversarial P0.5 architecture audit" || true
          git push --force origin "HEAD:refs/heads/cycle/${GITHUB_RUN_ID}/audit"

  direction:
    name: PRODUCT DIRECTOR — CONTINUE OR GATE
    needs: [integration, audit]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout integration with binding main control plane and mount audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CONTROL=/tmp/beetlejuice-control-plane
          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"
          for path in .github/scripts .opencode AGENTS.md docs state/factory.json; do
            if git cat-file -e "origin/main:${path}" 2>/dev/null; then
              git archive --format=tar origin/main "$path" | tar -xf - -C "$CONTROL"
            fi
          done
          git fetch origin lab/integration:refs/remotes/origin/lab/integration
          git switch -C lab/integration origin/lab/integration
          cp -a "$CONTROL/." .
          AUDIT="cycle/${GITHUB_RUN_ID}/audit"
          if git ls-remote --exit-code --heads origin "refs/heads/$AUDIT" >/dev/null 2>&1; then
            git fetch origin "$AUDIT:refs/remotes/origin/$AUDIT"
            git show "origin/$AUDIT:reports/latest-product-audit.md" > reports/latest-product-audit.md 2>/dev/null || true
            git show "origin/$AUDIT:reports/real-world-robustness.md" > reports/real-world-robustness.md 2>/dev/null || true
          fi

      - name: Install OpenCode
        shell: bash
        run: bash .github/scripts/install-opencode-with-retry.sh

      - name: Set evidence-gated factory direction
        shell: bash
        run: |
          bash .github/scripts/run-opencode-with-retry.sh run \
            --model "$BEETLEJUICE_MODEL" \
            --agent product_director \
            "Close Factory cycle ${GITHUB_RUN_ID} using the binding current-main P0.5 architecture-first control plane. P0 is already verified. P0.5 outranks P1. Read the latest audit and real-world robustness report if present and re-run targeted verification where useful. Update state/factory.json truthfully. A P0.5 item may be true only from executed evidence matching WC-007; real-corpus gates cannot pass from fixtures/prose. If any P0.5 gap is buildable in-repo, keep continue=true and next_action must name the highest-value concrete architecture/real-world gap. Never stop because this cycle had a failed lane/test/network/provider call. Do not resume P1 until P0_5_READY is defensible."

      - name: Validate and persist factory state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f state/factory.json || { echo "::error::Missing state/factory.json"; exit 1; }
          STATUS=$(jq -r '.status // empty' state/factory.json)
          CONTINUE=$(jq -r '.continue // empty' state/factory.json)
          case "$STATUS" in BUILDING|INTEGRATING|BLOCKED_EXTERNAL|P0_READY|P0_5_READY|COMPLETE) ;; *) echo "::error::Invalid factory status: $STATUS"; exit 1;; esac
          case "$CONTINUE" in true|false) ;; *) echo "::error::Invalid continue flag"; exit 1;; esac
          TMP=$(mktemp)
          jq --arg commit "$(git rev-parse HEAD)" --argjson cycle "${GITHUB_RUN_ID}" '.last_verified_commit=$commit | .cycle=$cycle' state/factory.json > "$TMP"
          mv "$TMP" state/factory.json
          git config user.name "beetlejuice-product-director"
          git config user.email "beetlejuice-director@autonomous.local"
          git add state reports || true
          git commit -m "Factory ${GITHUB_RUN_ID}: P0.5 product direction" || true
          git push origin HEAD:refs/heads/lab/integration
