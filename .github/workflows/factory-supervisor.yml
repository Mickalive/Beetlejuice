name: BEETLEJUICE Factory Supervisor

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "BEETLEJUICE Product Factory"
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-supervisor.yml'
      - '.github/workflows/factory-loop.yml'
      - '.github/scripts/run-opencode-with-retry.sh'
      - 'state/factory.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: beetlejuice-factory-supervisor
  cancel-in-progress: false

jobs:
  continuity:
    name: Ensure autonomous product continuity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Housekeep obsolete runs, artifacts, and cycle branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          KEEP_PER_ACTIVE_WORKFLOW=2
          ACTIVE_NAMES=(
            "BEETLEJUICE Product CI"
            "BEETLEJUICE Product Factory"
            "BEETLEJUICE Factory Supervisor"
          )

          STATE=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/state/factory.json?ref=main" 2>/dev/null || echo '{}')
          PRESERVE_IDS=$(jq -r '
            .. | objects | to_entries[]?
            | select(.key | test("run_id$"))
            | .value
            | select(type == "number")
          ' <<<"$STATE" 2>/dev/null | sort -u || true)

          mapfile -t RUN_ROWS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id,.name,.status,.created_at] | @tsv'
          )

          is_active_name() {
            local candidate="$1"
            for active in "${ACTIVE_NAMES[@]}"; do
              [[ "$candidate" == "$active" ]] && return 0
            done
            return 1
          }

          is_evidence_run() {
            local candidate="$1"
            grep -qx "$candidate" <<<"$PRESERVE_IDS" 2>/dev/null
          }

          ACTIVE_FACTORY_IDS=$(printf '%s\n' "${RUN_ROWS[@]}" | awk -F '\t' \
            '$2 == "BEETLEJUICE Product Factory" && $3 != "completed" {print $1}' | sort -u)
          ACTIVE_RUN_IDS=$(printf '%s\n' "${RUN_ROWS[@]}" | awk -F '\t' '$3 != "completed" {print $1}' | sort -u)

          declare -A KEPT_BY_NAME=()
          DELETED_RUNS=0
          for row in "${RUN_ROWS[@]}"; do
            IFS=$'\t' read -r RUN_ID RUN_NAME RUN_STATUS CREATED_AT <<<"$row"
            [[ -n "$RUN_ID" ]] || continue
            [[ "$RUN_STATUS" == "completed" ]] || continue
            if is_evidence_run "$RUN_ID"; then
              continue
            fi
            if is_active_name "$RUN_NAME"; then
              COUNT=${KEPT_BY_NAME["$RUN_NAME"]:-0}
              if (( COUNT < KEEP_PER_ACTIVE_WORKFLOW )); then
                KEPT_BY_NAME["$RUN_NAME"]=$((COUNT + 1))
                continue
              fi
            fi
            if gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" >/dev/null 2>&1; then
              DELETED_RUNS=$((DELETED_RUNS + 1))
            fi
          done

          DELETED_ARTIFACTS=0
          mapfile -t ARTIFACT_ROWS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id,.workflow_run.id] | @tsv' 2>/dev/null || true
          )
          for row in "${ARTIFACT_ROWS[@]}"; do
            IFS=$'\t' read -r ARTIFACT_ID RUN_ID <<<"$row"
            [[ -n "$ARTIFACT_ID" && -n "$RUN_ID" ]] || continue
            if grep -qx "$RUN_ID" <<<"$ACTIVE_RUN_IDS" 2>/dev/null || is_evidence_run "$RUN_ID"; then
              continue
            fi
            if gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" >/dev/null 2>&1; then
              DELETED_ARTIFACTS=$((DELETED_ARTIFACTS + 1))
            fi
          done

          mapfile -t CYCLE_REFS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/cycle/" \
              --jq '.[].ref' 2>/dev/null || true
          )

          DELETED_BRANCHES=0
          for REF in "${CYCLE_REFS[@]}"; do
            [[ "$REF" == refs/heads/cycle/* ]] || continue
            SHORT=${REF#refs/heads/}
            RUN_ID=$(cut -d/ -f2 <<<"$SHORT")
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || continue
            if grep -qx "$RUN_ID" <<<"$ACTIVE_FACTORY_IDS" 2>/dev/null || is_evidence_run "$RUN_ID"; then
              continue
            fi
            if gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${SHORT}" >/dev/null 2>&1; then
              DELETED_BRANCHES=$((DELETED_BRANCHES + 1))
            fi
          done

          echo "Housekeeping complete: deleted_runs=$DELETED_RUNS deleted_artifacts=$DELETED_ARTIFACTS deleted_cycle_branches=$DELETED_BRANCHES"

      - name: Enforce current-head factory and verified relaunch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(date +%s)
          CURRENT_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          echo "CURRENT_CONTROL_PLANE_HEAD=$CURRENT_HEAD"

          cancel_run() {
            local id="$1" reason="$2"
            echo "Cancelling factory run $id: $reason"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" >/dev/null 2>&1 || true
          }

          load_runs() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow factory-loop.yml --limit 100 \
              --json databaseId,status,conclusion,createdAt,headSha,event 2>/dev/null || echo '[]'
          }

          RUNS=$(load_runs)

          # Any live factory from an older control-plane is stale in every trigger mode,
          # not only on a push-triggered supervisor. Request cancellation but never wait
          # for GitHub's eventually-consistent status before ignoring it.
          while IFS=$'\t' read -r RUN_ID RUN_SHA; do
            [[ -n "$RUN_ID" ]] || continue
            if [[ "$RUN_SHA" != "$CURRENT_HEAD" ]]; then
              cancel_run "$RUN_ID" "stale control-plane revision $RUN_SHA; current=$CURRENT_HEAD"
            fi
          done < <(jq -r '.[] | select(.status != "completed") | [.databaseId,.headSha] | @tsv' <<<"$RUNS")

          # Watchdog applies to current-head candidates only. Stale runs are already dead
          # for continuity purposes even if the Actions API has not reflected cancellation.
          while IFS=$'\t' read -r RUN_ID RUN_STATUS CREATED_AT; do
            [[ -n "$RUN_ID" ]] || continue
            CREATED_EPOCH=$(date -d "$CREATED_AT" +%s 2>/dev/null || echo "$NOW")
            AGE_MIN=$(( (NOW - CREATED_EPOCH) / 60 ))
            case "$RUN_STATUS" in
              queued|pending|waiting|requested)
                (( AGE_MIN > 30 )) && cancel_run "$RUN_ID" "current-head run queued/pending for ${AGE_MIN}m"
                ;;
              in_progress)
                (( AGE_MIN > 420 )) && cancel_run "$RUN_ID" "current-head workflow zombie older than ${AGE_MIN}m"
                ;;
            esac
          done < <(jq -r --arg head "$CURRENT_HEAD" '.[] | select(.status != "completed" and .headSha == $head) | [.databaseId,.status,.createdAt] | @tsv' <<<"$RUNS")

          sleep 5
          RUNS=$(load_runs)

          # Invariant: exactly zero or one current-head Product Factory may be live.
          # Stale runs are never eligible to be kept, even while cancellation propagates.
          KEEP_ID=$(jq -r --arg head "$CURRENT_HEAD" '[.[] | select(.status == "in_progress" and .headSha == $head)] | sort_by(.databaseId) | .[0].databaseId // empty' <<<"$RUNS")
          if [[ -z "$KEEP_ID" ]]; then
            KEEP_ID=$(jq -r --arg head "$CURRENT_HEAD" '[.[] | select(.status != "completed" and .headSha == $head)] | sort_by(.databaseId) | .[0].databaseId // empty' <<<"$RUNS")
          fi

          if [[ -n "$KEEP_ID" ]]; then
            while IFS= read -r RUN_ID; do
              [[ -n "$RUN_ID" ]] || continue
              [[ "$RUN_ID" == "$KEEP_ID" ]] || cancel_run "$RUN_ID" "duplicate current-head factory; keeping $KEEP_ID"
            done < <(jq -r --arg head "$CURRENT_HEAD" '.[] | select(.status != "completed" and .headSha == $head) | .databaseId' <<<"$RUNS")
            sleep 5
            RUNS=$(load_runs)
          fi

          CURRENT_ACTIVE=$(jq --arg head "$CURRENT_HEAD" '[.[] | select(.status != "completed" and .headSha == $head)] | length' <<<"$RUNS")
          if [[ "$CURRENT_ACTIVE" -gt 0 ]]; then
            LIVE_ID=$(jq -r --arg head "$CURRENT_HEAD" '.[] | select(.status != "completed" and .headSha == $head) | .databaseId' <<<"$RUNS" | head -1)
            LIVE_STATUS=$(jq -r --argjson id "$LIVE_ID" '.[] | select(.databaseId == $id) | .status' <<<"$RUNS")
            LIVE_SHA=$(jq -r --argjson id "$LIVE_ID" '.[] | select(.databaseId == $id) | .headSha' <<<"$RUNS")
            echo "VERIFIED_FACTORY_CONTINUITY run_id=$LIVE_ID status=$LIVE_STATUS head=$LIVE_SHA"
            exit 0
          fi

          # main owns policy/control-plane; lab/integration owns cumulative progress.
          MAIN_META=$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/factory.json?ref=main" 2>/dev/null || echo '{}')
          MAIN_SHA=$(jq -r '.sha // empty' <<<"$MAIN_META")
          MAIN_STATE=$(jq -r '.content // empty' <<<"$MAIN_META" | tr -d '\n' | base64 -d 2>/dev/null || echo '{}')

          INTEGRATION_STATE='{}'
          if gh api "repos/${GITHUB_REPOSITORY}/branches/lab%2Fintegration" >/dev/null 2>&1; then
            INT_META=$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/factory.json?ref=lab/integration" 2>/dev/null || echo '{}')
            INTEGRATION_STATE=$(jq -r '.content // empty' <<<"$INT_META" | tr -d '\n' | base64 -d 2>/dev/null || echo '{}')
          fi

          MAIN_CYCLE=$(jq -r '.cycle // 0' <<<"$MAIN_STATE" 2>/dev/null || echo 0)
          INT_CYCLE=$(jq -r '.cycle // 0' <<<"$INTEGRATION_STATE" 2>/dev/null || echo 0)
          if [[ "$INT_CYCLE" =~ ^[0-9]+$ && "$MAIN_CYCLE" =~ ^[0-9]+$ ]] && (( INT_CYCLE >= MAIN_CYCLE )); then
            MERGED_STATE=$(jq -S -s '.[0] * .[1]' <(printf '%s' "$MAIN_STATE") <(printf '%s' "$INTEGRATION_STATE"))
          else
            MERGED_STATE=$(jq -S . <<<"$MAIN_STATE")
          fi

          MAIN_CANON=$(jq -S . <<<"$MAIN_STATE" 2>/dev/null || echo '{}')
          if [[ -n "$MAIN_SHA" && "$MERGED_STATE" != "$MAIN_CANON" ]]; then
            ENCODED=$(printf '%s' "$MERGED_STATE" | base64 -w0)
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/state/factory.json" \
              -f message='factory: sync durable autonomous progress state' \
              -f content="$ENCODED" \
              -f sha="$MAIN_SHA" \
              -f branch=main >/dev/null
            echo "Durable integration state synchronized to main; continuing in this same supervisor invocation."
            CURRENT_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
            echo "CURRENT_CONTROL_PLANE_HEAD_AFTER_STATE_SYNC=$CURRENT_HEAD"
          fi

          STATE="$MERGED_STATE"
          STATUS=$(jq -r '.status // "BUILDING"' <<<"$STATE")
          CONTINUE=$(jq -r '.continue // true' <<<"$STATE")
          NEXT_ACTION=$(jq -r '.next_action // "CONTINUE_HIGHEST_VALUE_UNFINISHED_WORK"' <<<"$STATE")
          REQUIRES_USER=$(jq -r '.requires_user_action // false' <<<"$STATE")
          LOCAL_EXHAUSTED=$(jq -r '.repo_local_work_exhausted // false' <<<"$STATE")
          TERMINAL_READY=$(jq -r '.terminal_ready // false' <<<"$STATE")
          CHECK_GROUPS=$(jq '[to_entries[] | select(.key | endswith("_checks")) | select(.value | type == "object")] | length' <<<"$STATE")
          REMAINING=$(jq '[to_entries[] | select(.key | endswith("_checks")) | select(.value | type == "object") | .value | to_entries[] | select(.value == false)] | length' <<<"$STATE")

          if [[ "$STATUS" == "COMPLETE" && "$REMAINING" -eq 0 && "$CHECK_GROUPS" -gt 0 && "$TERMINAL_READY" == true ]]; then
            echo "Factory terminal predicate satisfied."
            exit 0
          fi
          if [[ "$STATUS" == "COMPLETE" ]]; then
            echo "::warning::Rejecting premature COMPLETE: check_groups=$CHECK_GROUPS remaining_false_gates=$REMAINING terminal_ready=$TERMINAL_READY"
            STATUS="BUILDING"
            CONTINUE=true
          fi
          if [[ "$REQUIRES_USER" == true && "$LOCAL_EXHAUSTED" == true ]]; then
            echo "All repo-local work exhausted and explicit human action required. Pausing safely. next_action=$NEXT_ACTION"
            exit 0
          fi
          if [[ "$CONTINUE" != true || "$STATUS" == "BLOCKED_EXTERNAL" ]]; then
            echo "Overriding non-terminal stop: status=$STATUS continue=$CONTINUE remaining_false_gates=$REMAINING"
          fi

          echo "No current-head factory exists. Dispatching and VERIFYING relaunch: head=$CURRENT_HEAD status=$STATUS remaining_false_gates=$REMAINING next_action=$NEXT_ACTION"
          RUNS=$(load_runs)
          BASE_MAX=$(jq '[.[].databaseId] | max // 0' <<<"$RUNS")
          VERIFIED=false

          for ATTEMPT in 1 2 3 4 5; do
            echo "Factory dispatch attempt $ATTEMPT/5 (previous max run id=$BASE_MAX head=$CURRENT_HEAD)"
            if gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/factory-loop.yml/dispatches" \
              -f ref=main >/dev/null 2>&1; then
              for POLL in $(seq 1 12); do
                sleep 5
                CHECK=$(load_runs)
                NEW_ID=$(jq -r --argjson base "$BASE_MAX" --arg head "$CURRENT_HEAD" '[.[] | select(.databaseId > $base and .headSha == $head and .event == "workflow_dispatch")] | sort_by(.databaseId) | .[0].databaseId // empty' <<<"$CHECK")
                if [[ -n "$NEW_ID" ]]; then
                  NEW_STATUS=$(jq -r --argjson id "$NEW_ID" '.[] | select(.databaseId == $id) | .status' <<<"$CHECK")
                  NEW_EVENT=$(jq -r --argjson id "$NEW_ID" '.[] | select(.databaseId == $id) | .event' <<<"$CHECK")
                  NEW_SHA=$(jq -r --argjson id "$NEW_ID" '.[] | select(.databaseId == $id) | .headSha' <<<"$CHECK")
                  echo "VERIFIED_FACTORY_RELAUNCH run_id=$NEW_ID status=$NEW_STATUS event=$NEW_EVENT head=$NEW_SHA"
                  VERIFIED=true
                  break 2
                fi
              done
            fi
            sleep $((ATTEMPT * 10))
          done

          if [[ "$VERIFIED" != true ]]; then
            echo "::error::FACTORY_RELAUNCH_NOT_VERIFIED after 5 dispatch attempts for head=$CURRENT_HEAD. Failing supervisor so the 5-minute heartbeat retries visibly."
            exit 1
          fi
